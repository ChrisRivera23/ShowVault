name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore services/api/src/ShowVault.Api/ShowVault.Api.csproj
      - run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project services/api/src/ShowVault.Api/ShowVault.Api.csproj --startup-project services/api/src/ShowVault.Api/ShowVault.Api.csproj
      - run: dotnet test services/api/tests/ShowVault.Api.Tests/ShowVault.Api.Tests.csproj
      - run: dotnet test services/contracts/tests/ShowVault.AgentContracts.Tests/ShowVault.AgentContracts.Tests.csproj
      - run: dotnet test services/platform/tests/ShowVault.Platform.Tests/ShowVault.Platform.Tests.csproj
      - run: dotnet test services/agent/tests/ShowVault.Agent.Tests/ShowVault.Agent.Tests.csproj
      - run: dotnet build services/agent/src/ShowVault.Agent/ShowVault.Agent.csproj --configuration Release

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/showvault_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
