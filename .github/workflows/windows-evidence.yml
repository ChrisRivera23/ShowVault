name: Controlled Windows evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-windows-evidence
  cancel-in-progress: false

jobs:
  package-and-prove:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: apps/showvault_app
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          channel: stable
          architecture: x64
          cache: true

      - name: Verify Windows toolchain
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot) -or
              -not [System.IO.Path]::IsPathFullyQualified($vcpkgRoot) -or
              $vcpkgRoot -notmatch '^[A-Za-z]:[\\/][^\r\n]+$') {
            throw 'The controlled runner did not provide a local VCPKG_INSTALLATION_ROOT.'
          }
          $vcpkgRoot = [System.IO.Path]::GetFullPath($vcpkgRoot)
          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          $vcpkgToolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $vcpkg -PathType Leaf) -or
              -not (Test-Path -LiteralPath $vcpkgToolchain -PathType Leaf)) {
            throw 'The controlled runner vcpkg installation is incomplete.'
          }
          & $vcpkg version
          if ($LASTEXITCODE -ne 0) {
            throw 'The controlled runner vcpkg executable failed.'
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $inno = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $inno -PathType Leaf)) {
            throw 'Inno Setup 6 is unavailable on the controlled runner.'
          }
          (Get-Item -LiteralPath $inno).VersionInfo.FileVersion

      - name: Install pinned Windows native dependencies
        run: |
          $vcpkgRoot = [System.IO.Path]::GetFullPath($env:VCPKG_ROOT)
          $runnerVcpkgRoot = [System.IO.Path]::GetFullPath($env:VCPKG_INSTALLATION_ROOT)
          if (-not [string]::Equals(
              $vcpkgRoot,
              $runnerVcpkgRoot,
              [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'VCPKG_ROOT was redirected after toolchain validation.'
          }
          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          $requiredNativePackages = @(
            'cpprestsdk:x64-windows',
            'openssl:x64-windows',
            'boost-system:x64-windows',
            'boost-date-time:x64-windows',
            'boost-regex:x64-windows'
          )
          & $vcpkg install @requiredNativePackages
          if ($LASTEXITCODE -ne 0) {
            throw 'The controlled runner failed to install the pinned Windows native dependencies.'
          }
          $installedNativePackages = @(& $vcpkg list)
          foreach ($package in $requiredNativePackages) {
            $packagePattern = '^' + [regex]::Escape($package) + '\s'
            if (-not ($installedNativePackages -match $packagePattern)) {
              throw "The controlled runner did not install required package $package."
            }
          }

      - name: Run Windows Flutter verification
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build normal current-user package
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'showvault-windows-package'
          pwsh -File .\packaging\windows\build-app.ps1 -OutputDirectory $output

      - name: Execute installed replacement proof
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'showvault-windows-proof-evidence'
          pwsh -File .\tool\run-windows-installed-proof.ps1 -OutputDirectory $output

      - name: Record workflow provenance
        run: |
          $proofRoot = Join-Path $env:RUNNER_TEMP 'showvault-windows-proof-evidence'
          $sourceCommitSha = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceCommitSha -notmatch '^[0-9a-f]{40}$') {
            throw 'The checked-out source commit is invalid.'
          }
          $provenance = [ordered]@{
            formatVersion = 'showvault.windows-workflow-provenance.v1'
            sourceCommitSha = $sourceCommitSha
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            workflowEvent = $env:GITHUB_EVENT_NAME
            workflowJob = $env:GITHUB_JOB
            runnerOs = $env:RUNNER_OS
            runnerArchitecture = $env:RUNNER_ARCH
            artifactName = 'showvault-controlled-windows-evidence'
          }
          $provenancePath = Join-Path $proofRoot 'windows-workflow-provenance.json'
          $provenance | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $provenancePath -Encoding utf8NoBOM
          $provenanceHash = (Get-FileHash -LiteralPath $provenancePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath (Join-Path $proofRoot 'SHA256SUMS') -Value "$provenanceHash  windows-workflow-provenance.json" -Encoding ascii

      - name: Verify checksums and cleanup
        run: |
          function Test-ChecksumFile([string]$root) {
            foreach ($line in Get-Content -LiteralPath (Join-Path $root 'SHA256SUMS')) {
              $parts = $line -split '\s+', 2
              if ($parts.Count -ne 2) { throw 'A checksum line is malformed.' }
              $actual = (Get-FileHash -LiteralPath (Join-Path $root $parts[1]) -Algorithm SHA256).Hash
              if ($actual.ToLowerInvariant() -ne $parts[0]) {
                throw "Checksum validation failed for $($parts[1])."
              }
            }
          }
          Test-ChecksumFile (Join-Path $env:RUNNER_TEMP 'showvault-windows-package')
          Test-ChecksumFile (Join-Path $env:RUNNER_TEMP 'showvault-windows-proof-evidence')
          if (Test-Path -LiteralPath 'Registry::HKEY_CURRENT_USER\Software\Classes\showvault') {
            throw 'The callback registration survived proof cleanup.'
          }
          $owned = @(Get-ChildItem -LiteralPath $env:TEMP -Directory |
            Where-Object { $_.Name -match '^showvault-(windows-proof|upgrade-windows)-' })
          if ($owned.Count -ne 0) {
            throw 'Owned Windows proof state survived cleanup.'
          }

      - name: Upload checksummed synthetic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: showvault-controlled-windows-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/showvault-windows-package/*.exe
            ${{ runner.temp }}/showvault-windows-package/*.zip
            ${{ runner.temp }}/showvault-windows-package/*.json
            ${{ runner.temp }}/showvault-windows-package/SHA256SUMS
            ${{ runner.temp }}/showvault-windows-proof-evidence/*
