services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: showvault-test
      MINIO_ROOT_PASSWORD: showvault-test-secret
    ports:
      - "9000:9000"
    volumes:
      - showvault-s3-test:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  s3-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 showvault-test showvault-test-secret &&
        mc mb --ignore-existing local/showvault-prototype
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HostedSync__S3__Bucket: showvault-prototype
      HostedSync__S3__ServiceUrl: http://minio:9000
      HostedSync__S3__ForcePathStyle: "true"
      AWS_ACCESS_KEY_ID: showvault-test
      AWS_SECRET_ACCESS_KEY: showvault-test-secret
    depends_on:
      s3-init:
        condition: service_completed_successfully

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HostedSync__S3__Bucket: showvault-prototype
      HostedSync__S3__ServiceUrl: http://minio:9000
      HostedSync__S3__ForcePathStyle: "true"
      AWS_ACCESS_KEY_ID: showvault-test
      AWS_SECRET_ACCESS_KEY: showvault-test-secret
    depends_on:
      s3-init:
        condition: service_completed_successfully

volumes:
  showvault-s3-test:
