name: showvault-prototype

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Platform: Host=postgres;Port=5432;Database=${POSTGRES_DB:-showvault};Username=${POSTGRES_USER:-showvault};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  Auth0__Domain: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN}
  Auth0__Audience: ${AUTH0_AUDIENCE:-https://api.showvault.app}
  HostedSync__Provider: S3
  HostedSync__S3__Bucket: ${SHOWVAULT_S3_BUCKET:?set SHOWVAULT_S3_BUCKET}
  HostedSync__S3__Region: ${AWS_REGION:?set AWS_REGION}
  HostedSync__S3__ServiceUrl: ${SHOWVAULT_S3_SERVICE_URL:-}
  HostedSync__S3__Prefix: ${SHOWVAULT_S3_PREFIX:-showvault/v1}
  HostedSync__S3__ForcePathStyle: ${SHOWVAULT_S3_FORCE_PATH_STYLE:-false}
  AWS_REGION: ${AWS_REGION:?set AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

services:
  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-showvault}
      POSTGRES_USER: ${POSTGRES_USER:-showvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - showvault-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: showvault-api:${SHOWVAULT_VERSION:-prototype}
    command: ["--migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: showvault-api:${SHOWVAULT_VERSION:-prototype}
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${SHOWVAULT_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  showvault-postgres:
