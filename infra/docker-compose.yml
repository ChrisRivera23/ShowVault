services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-showvault}
      POSTGRES_USER: ${POSTGRES_USER:-showvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-showvault-dev}
    ports:
      - "5432:5432"
    volumes:
      - showvault-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  showvault-postgres:
